<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhotonMixer Phase 1</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: #1a1a1a;
      font-family: 'Segoe UI', sans-serif;
    }

    #canvas {
      display: block;
      touch-action: none;
      cursor: crosshair;
    }

    #perf-monitor {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.8);
      color: #0f0;
      padding: 10px 15px;
      border-radius: 5px;
      font-family: monospace;
      font-size: 12px;
      pointer-events: none;
      z-index: 1000;
    }

    .perf-value {
      color: #fff;
    }

    .perf-warning {
      color: #ff0;
    }

    .perf-error {
      color: #f00;
    }

    #brush-controls {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 10px 14px;
      border-radius: 5px;
      font-family: monospace;
      font-size: 12px;
      z-index: 1000;
      user-select: none;
      min-width: 190px;
    }

    .ctrl-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .ctrl-label {
      width: 58px;
      color: #aaa;
    }

    input[type="range"] {
      width: 80px;
      cursor: pointer;
      accent-color: #0f0;
    }

    .ctrl-val {
      width: 26px;
      text-align: right;
    }

    #clear-btn {
      width: 100%;
      margin-top: 4px;
      padding: 4px 0;
      background: #2a2a2a;
      color: #ccc;
      border: 1px solid #444;
      border-radius: 3px;
      cursor: pointer;
      font-family: monospace;
      font-size: 11px;
    }

    #clear-btn:hover {
      background: #383838;
      color: #fff;
    }
  </style>
</head>
<body>
  <div id="perf-monitor">
    <div>FPS: <span id="fps" class="perf-value">--</span></div>
    <div>Latency: <span id="latency" class="perf-value">--</span> ms</div>
    <div>Points: <span id="points" class="perf-value">0</span></div>
  </div>
  <div id="brush-controls">
    <div class="ctrl-row">
      <span class="ctrl-label">サイズ</span>
      <input type="range" id="brush-size" min="1" max="60" value="20">
      <span id="brush-size-val" class="ctrl-val">20</span>px
    </div>
    <div class="ctrl-row">
      <span class="ctrl-label">不透明度</span>
      <input type="range" id="brush-alpha" min="1" max="100" value="100">
      <span id="brush-alpha-val" class="ctrl-val">100</span>%
    </div>
    <button id="clear-btn">クリア</button>
  </div>
  <canvas id="canvas"></canvas>
  <script type="module" src="dist/src/main.js"></script>
</body>
</html>
