<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhotonMixer Phase 1</title>
  <script type="importmap">
  {
    "imports": {
      "fflate": "./node_modules/fflate/esm/browser.js"
    }
  }
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: #1a1a1a;
      font-family: 'Segoe UI', sans-serif;
    }

    #canvas {
      display: block;
      touch-action: none;
      cursor: crosshair;
    }

    #perf-monitor {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.8);
      color: #0f0;
      padding: 10px 15px;
      border-radius: 5px;
      font-family: monospace;
      font-size: 12px;
      pointer-events: none;
      z-index: 1000;
    }

    .perf-value {
      color: #fff;
    }

    .perf-warning {
      color: #ff0;
    }

    .perf-error {
      color: #f00;
    }

    #brush-controls {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 10px 14px;
      border-radius: 5px;
      font-family: monospace;
      font-size: 12px;
      z-index: 1000;
      user-select: none;
      min-width: 190px;
    }

    .ctrl-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .ctrl-label {
      width: 58px;
      color: #aaa;
    }

    input[type="range"] {
      width: 80px;
      cursor: pointer;
      accent-color: #0f0;
    }

    .ctrl-val {
      width: 26px;
      text-align: right;
    }

    #clear-btn {
      width: 100%;
      margin-top: 4px;
      padding: 4px 0;
      background: #2a2a2a;
      color: #ccc;
      border: 1px solid #444;
      border-radius: 3px;
      cursor: pointer;
      font-family: monospace;
      font-size: 11px;
    }

    #clear-btn:hover {
      background: #383838;
      color: #fff;
    }

    .tool-btn {
      flex: 1;
      padding: 6px 0;
      background: #2a2a2a;
      color: #888;
      border: 1px solid #444;
      border-radius: 3px;
      cursor: pointer;
      font-family: monospace;
      font-size: 11px;
    }

    .tool-btn.active {
      background: #0f0;
      color: #000;
      border-color: #0f0;
    }
  </style>
</head>
<body>
  <div id="perf-monitor">
    <div>FPS: <span id="fps" class="perf-value">--</span></div>
    <div>Latency: <span id="latency" class="perf-value">--</span> ms</div>
    <div>Points: <span id="points" class="perf-value">0</span></div>
    <div>Zoom: <span id="zoom-val" class="perf-value">100</span>%</div>
  </div>

  <!-- 新規キャンバスダイアログ -->
  <div id="new-canvas-modal" style="position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 2000;">
    <div style="background: #2a2a2a; color: #fff; padding: 20px; border-radius: 8px; border: 1px solid #444; width: 300px;">
      <h3 style="margin-bottom: 15px; font-size: 14px; border-bottom: 1px solid #444; padding-bottom: 5px;">新規キャンバス</h3>
      <div class="ctrl-row">
        <span class="ctrl-label">幅 (px)</span>
        <input type="number" id="canvas-w" value="2000" style="background: #1a1a1a; color: #fff; border: 1px solid #444; width: 80px; padding: 2px 5px;">
      </div>
      <div class="ctrl-row">
        <span class="ctrl-label">高さ (px)</span>
        <input type="number" id="canvas-h" value="2000" style="background: #1a1a1a; color: #fff; border: 1px solid #444; width: 80px; padding: 2px 5px;">
      </div>
      <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button id="create-canvas-btn" class="tool-btn active" style="flex: 1;">作成</button>
      </div>
    </div>
  </div>
  <div id="brush-controls">
    <div class="ctrl-row">
      <button id="tool-brush" class="tool-btn active" title="ブラシ (B)">🖌️</button>
      <button id="tool-eraser" class="tool-btn" title="消しゴム (E)">🧹</button>
      <button id="tool-blur" class="tool-btn" title="ぼかし (U)">💧</button>
      <button id="tool-line" class="tool-btn" title="直線 (V)">📏</button>
      <button id="tool-spoit" class="tool-btn" title="スポイト (I)">🧪</button>
      <button id="tool-bucket" class="tool-btn" title="バケツ (G)">🪣</button>
      <button id="tool-select" class="tool-btn" title="矩形選択 (M)">⬚</button>
      <button id="tool-move" class="tool-btn" title="移動 (W)">✥</button>
      <button id="tool-transform" class="tool-btn" title="変形 (T)">⤢</button>
    </div>
    <div class="ctrl-row" id="transform-controls" style="display:none;">
      <span class="ctrl-label">変形</span>
      <button id="transform-commit" class="tool-btn" style="flex:1;" title="確定 (Enter)">確定</button>
      <button id="transform-cancel" class="tool-btn" style="flex:1;" title="キャンセル (Esc)">取消</button>
    </div>
    <div class="ctrl-row" id="select-controls" style="display:none;">
      <span class="ctrl-label">選択</span>
      <button id="select-all" class="tool-btn" style="flex:1;">全選択</button>
      <button id="select-clear" class="tool-btn" style="flex:1;">解除</button>
    </div>
    <div class="ctrl-row" style="margin-top: 10px;">
      <span class="ctrl-label">サイズ</span>
      <input type="range" id="brush-size" min="1" max="100" value="20" style="width: 50px;">
      <input type="number" id="brush-size-num" min="1" max="100" value="20" style="width: 36px; background: #1a1a1a; color: #fff; border: 1px solid #444; padding: 2px 4px; font-family: monospace; font-size: 11px;">
      <span style="font-size: 10px;">px</span>
    </div>
    <div class="ctrl-row">
      <span class="ctrl-label">不透明度</span>
      <input type="range" id="brush-alpha" min="1" max="100" value="100">
      <span id="brush-alpha-val" class="ctrl-val">100</span>%
    </div>
    <div class="ctrl-row">
      <span class="ctrl-label">にじみ</span>
      <input type="range" id="brush-wet" min="0" max="100" value="0">
      <span id="brush-wet-val" class="ctrl-val">0</span>%
    </div>
    <div class="ctrl-row">
      <span class="ctrl-label">補正</span>
      <input type="range" id="brush-stabilize" min="0" max="100" value="30">
      <span id="brush-stabilize-val" class="ctrl-val">30</span>%
    </div>
    <div class="ctrl-row">
      <span class="ctrl-label">筆圧</span>
      <select id="pressure-curve" style="width:80px;font-family:monospace;font-size:11px;background:#1a1a1a;color:#fff;border:1px solid #444;cursor:pointer;">
        <option value="smooth">標準</option>
        <option value="linear">リニア</option>
        <option value="ease-in">入り遅</option>
        <option value="ease-out">入り早</option>
      </select>
    </div>
    <div class="ctrl-row">
      <span class="ctrl-label">方式</span>
      <select id="mix-mode" style="width:80px;font-family:monospace;font-size:11px;background:#1a1a1a;color:#fff;border:1px solid #444;cursor:pointer;">
        <option value="stamp">スタンプ</option>
        <option value="progressive">引きずり</option>
      </select>
    </div>
    <div style="margin-top: 6px;">
      <div id="color-picker"></div>
      <input type="color" id="brush-color" value="#ffffff" style="display:none;">
    </div>
    <div class="ctrl-row" style="margin-top: 8px; border-top: 1px solid #333; padding-top: 8px;">
      <span class="ctrl-label">テクスチャ</span>
      <button id="load-texture-btn" style="flex: 1; padding: 2px 8px; background: #2a2a2a; color: #ccc; border: 1px solid #444; border-radius: 3px; cursor: pointer; font-family: monospace; font-size: 10px;">読込</button>
      <button id="clear-texture-btn" style="width: 32px; padding: 2px 4px; background: #2a2a2a; color: #888; border: 1px solid #444; border-radius: 3px; cursor: pointer; font-family: monospace; font-size: 10px;">×</button>
    </div>
    <div class="ctrl-row">
      <span class="ctrl-label">スケール</span>
      <input type="range" id="texture-scale" min="1" max="20" value="1" style="width: 50px;">
      <span id="texture-scale-val" class="ctrl-val">1</span>x
    </div>
    <div class="ctrl-row">
      <span class="ctrl-label">許容値</span>
      <input type="range" id="bucket-tolerance" min="0" max="100" value="0" style="width: 50px;">
      <span id="bucket-tolerance-val" class="ctrl-val">0</span>%
    </div>
    <div class="ctrl-row">
      <span class="ctrl-label">背景</span>
      <button id="bg-transparent" class="tool-btn active" style="flex:1;">透明</button>
      <button id="bg-white" class="tool-btn" style="flex:1;">白</button>
      <input type="color" id="bg-color" value="#ffffff" style="width: 28px; height: 18px; border: none; cursor: pointer;">
    </div>
    <div class="ctrl-row" style="margin-top: 8px; border-top: 1px solid #333; padding-top: 8px;">
      <span class="ctrl-label">プリセット</span>
      <button id="save-preset-btn" class="tool-btn" style="flex: 1;">保存</button>
      <button id="load-preset-btn" class="tool-btn" style="flex: 1;">読込</button>
    </div>
    <div class="ctrl-row" style="margin-top: 4px;">
      <button id="save-pmx-btn" class="tool-btn" style="flex: 1;">保存(.pmx)</button>
      <button id="open-pmx-btn" class="tool-btn" style="flex: 1;">開く</button>
    </div>
    <button id="export-png-btn" style="width: 100%; margin: 4px 0; padding: 4px 0; background: #2a2a2a; color: #ccc; border: 1px solid #444; border-radius: 3px; cursor: pointer; font-family: monospace; font-size: 11px;">PNG 書き出し</button>
    <button id="clear-btn">クリア</button>
  </div>
  <input type="file" id="texture-file-input" accept="image/*" style="display: none;">
  <input type="file" id="preset-file-input" accept=".zip" style="display: none;">
  <input type="file" id="pmx-file-input" accept=".pmx" style="display: none;">

  <!-- レイヤーパネル（右下） -->
  <div id="layer-panel" style="position: fixed; right: 10px; bottom: 10px; width: 220px; background: rgba(0,0,0,0.85); border: 1px solid #444; border-radius: 5px; font-family: monospace; font-size: 11px; color: #ccc; z-index: 1000;">
    <div style="display: flex; align-items: center; gap: 4px; padding: 6px 8px; border-bottom: 1px solid #444;">
      <span style="flex: 1;">レイヤー</span>
      <button id="layer-add" class="tool-btn" style="width: 24px; padding: 2px 0;" title="追加">＋</button>
      <button id="layer-del" class="tool-btn" style="width: 24px; padding: 2px 0;" title="削除">－</button>
      <button id="layer-up" class="tool-btn" style="width: 24px; padding: 2px 0;" title="上へ">▲</button>
      <button id="layer-down" class="tool-btn" style="width: 24px; padding: 2px 0;" title="下へ">▼</button>
    </div>
    <div id="layer-list" style="max-height: 240px; overflow-y: auto;"></div>
  </div>

  <canvas id="canvas"></canvas>
  <!-- 選択範囲オーバーレイ（点線枠をスクリーン座標で描画） -->
  <canvas id="selection-overlay" style="position: fixed; left: 0; top: 0; pointer-events: none; z-index: 1400;"></canvas>
  <div id="brush-cursor" style="position: fixed; border: 1px solid rgba(255,255,255,0.7); border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); z-index: 1500; display: none; mix-blend-mode: difference;"></div>
  <script type="module" src="dist/src/main.js"></script>
</body>
</html>
